<!doctype html>
<html lang="en">
  <head>
    <!-- Immediate dark fallback background for html/body - prevents white flash.
         Once CSS variables are available, we switch to the themed background. -->
    <style>
      html,body{background:#0a1628;background:hsl(var(--background))}
    </style>
    <!-- BLOCKING pre-paint theme initializer.
         Must run before CSS/React so the correct .dark class is on <html> before first paint.
         - Runs one-time migration from legacy "light"/"system" -> "dark".
         - Forces dark on /demo (without persisting, so user prefs elsewhere are preserved).
         - Reads next-themes' default "theme" key from localStorage. -->
    <!-- Legacy domain bridge: zen.solar hosts are retired in favour of zensolar.com.
         Browser visitors are forwarded; already-installed PWAs (standalone display)
         are left alone so their home-screen icon keeps working in-scope. -->
    <script>
      (function () {
        try {
          var h = location.hostname;
          var legacy = h === 'zen.solar' || h.endsWith('.zen.solar');
          if (!legacy) return;
          var standalone =
            window.matchMedia('(display-mode: standalone)').matches ||
            window.navigator.standalone === true;
          if (standalone) return;
          var target = h.indexOf('beta.') === 0 ? 'beta.zensolar.com' : 'zensolar.com';
          location.replace('https://' + target + location.pathname + location.search + location.hash);
        } catch (e) {}
      })();
    </script>

    <script>
      (function () {
        try {
          var MIGRATION_KEY = 'zs-theme-default-v2';
          var STORAGE_KEY = 'theme'; // next-themes default
          var ls = window.localStorage;

          // One-time migration: anyone on light/system/unset becomes dark by default.
          if (!ls.getItem(MIGRATION_KEY)) {
            var prior = ls.getItem(STORAGE_KEY);
            if (!prior || prior === 'light' || prior === 'system') {
              ls.setItem(STORAGE_KEY, 'dark');
            }
            ls.setItem(MIGRATION_KEY, '1');
          }

          var path = window.location.pathname || '';
          var isDemo = path === '/demo' || path.indexOf('/demo/') === 0;

          var stored = ls.getItem(STORAGE_KEY);
          // Default is dark unless the user explicitly chose light.
          var theme = isDemo ? 'dark' : (stored === 'light' ? 'light' : 'dark');

          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(theme);
          root.style.colorScheme = theme;
        } catch (e) {
          // Fail safe -> dark
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <!-- Google tag (gtag.js) - deferred to avoid blocking FCP/LCP -->

      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-H0G72NVJHY');

      window.addEventListener('load', function() {
        var s = document.createElement('script');
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-H0G72NVJHY';

    <!-- "default" lets iOS own the status bar (with theme-color background) so the
         app starts naturally below the Dynamic Island — no manual safe-area dodging.
         This is what modern dashboard PWAs (Twitter, Linear, etc.) use. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <script>
      (function () {
        var hostname = window.location.hostname;
        var isPreviewHost = hostname.includes('id-preview--') || hostname.endsWith('.lovableproject.com');
        var isInIframe = false;

        try {
          isInIframe = window.self !== window.top;
        } catch (e) {
          isInIframe = true;
        }

        if (!isPreviewHost && !isInIframe) {
          document.write('<link rel="manifest" href="/manifest.webmanifest" />');
        }
      })();
    </script>
    <script>
      (function () {
        var BOOT_RECOVERY_KEY = 'zensolar_boot_recovery';

        function isRecoverableBootError(message) {
          return (
            message.indexOf('Importing a module script failed') !== -1 ||
            message.indexOf('Failed to fetch dynamically imported module') !== -1 ||
            message.indexOf('Loading chunk') !== -1 ||
            message.indexOf('Loading CSS chunk') !== -1
          );
        }

        window.__zensolarBooted = false;
        window.__zensolarRecoverBoot = function () {
          try {
            var lastAttempt = Number(sessionStorage.getItem(BOOT_RECOVERY_KEY) || 0);
            var now = Date.now();
            if (now - lastAttempt < 30000) return;

            sessionStorage.setItem(BOOT_RECOVERY_KEY, String(now));
            var url = new URL(window.location.href);
            url.searchParams.set('boot-recover', String(now));
            window.location.replace(url.toString());
          } catch (error) {
            window.location.reload();
          }
        };

        window.addEventListener('error', function (event) {
          var message = String((event && event.message) || '');
          if (isRecoverableBootError(message)) {
            window.__zensolarRecoverBoot();
          }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          var message = String((reason && reason.message) || reason || '');
          if (isRecoverableBootError(message)) {
            window.__zensolarRecoverBoot();
          }
        });

        window.setTimeout(function () {
          // Only recover on TRUE cold-boot failure: React never mounted AND
          // the #root has no rendered content. This avoids reloading during
          // slow-but-successful boots, OAuth reconnect hops, or normal
          // client-side navigations that happen to be slow.
          try {
            var rootEl = document.getElementById('root');
            var rootHasContent = !!(rootEl && rootEl.children && rootEl.children.length > 0);
            if (window.__zensolarBooted) return;
            if (rootHasContent) return;
            window.__zensolarRecoverBoot();
          } catch (e) { /* noop */ }
        }, 12000);
      })();
    </script>
    <script>
      (function () {
        // If a previous session triggered ?boot-recover=<ts>, strip it from
        // the URL after boot so it doesn't stick to later navigations or
        // sharing links. Purely cosmetic — the recovery already happened.
        try {
          var u = new URL(window.location.href);
          if (u.searchParams.has('boot-recover')) {
            u.searchParams.delete('boot-recover');
            window.history.replaceState({}, '', u.pathname + (u.search ? u.search : '') + u.hash);
          }
        } catch (e) { /* noop */ }
      })();
    </script>

    <!-- Prevent any initial white flash before CSS/React are ready -->
    <!-- CRITICAL: Full viewport coverage for iOS PWA to avoid white bar at bottom -->
    <style>
      html,
      body {
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 0;
        /* Solid background color that extends into safe areas */
        background: #0a1628;
        background: hsl(var(--background));
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh;
        background: #0a1628;
        background: hsl(var(--background));
      }

      /* Pre-hydration boot indicator (removed automatically when React mounts) */
      .zs-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0a0c0e;
        animation: zs-boot-in 240ms ease-out both;
      }
      .zs-boot-mark {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: linear-gradient(90deg, #00e19b 0%, #00c2ff 100%);
        opacity: 0.9;
        filter: blur(0.2px);
        animation: zs-boot-pulse 1.4s ease-in-out infinite;
      }
      .zs-boot-bar {
        width: 132px;
        height: 2px;
        border-radius: 2px;
        background: rgba(232, 234, 237, 0.1);
        overflow: hidden;
      }
      .zs-boot-bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, #00e19b 0%, #00c2ff 100%);
        animation: zs-boot-slide 1.15s ease-in-out infinite;
      }
      @keyframes zs-boot-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes zs-boot-pulse {
        0%, 100% { transform: scale(0.88); opacity: 0.55; }
        50% { transform: scale(1); opacity: 1; }
      }
      @keyframes zs-boot-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(360%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .zs-boot-mark, .zs-boot-bar span, .zs-boot { animation: none; }
      }
    </style>

    <!-- Theme fonts are injected on demand by the learn/app theme hooks
         (see useLearnTheme.ts and appThemes.ts). The default home/app routes
         use the system font stack, so we skip a 4-family CSS request entirely
         for the common case. We still preconnect so the on-demand fetch is fast. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-render-blocking web fonts: the boot splash and first paint must
         not wait on a third-party stylesheet round-trip. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
    </noscript>

  </head>


  <body>
    <div id="root">
      <!-- Pre-hydration boot state. React replaces this on first render, so the
           visitor sees a brand-colored mark instead of a raw black screen. -->
      <div class="zs-boot" aria-hidden="true">
        <div class="zs-boot-mark"></div>
        <div class="zs-boot-bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
